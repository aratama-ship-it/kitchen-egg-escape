<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101615">
  <title>厨房脱出：卵の操作試作</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="game-shell" aria-label="厨房から逃げる卵の操作試作">
    <canvas
      id="game-canvas"
      width="960"
      height="720"
      role="img"
      aria-label="3D剛体物理で床を転がり、厨房の裏口を目指す卵。障害物への強い衝突で殻が割れます。"
    ></canvas>

    <div class="hud" aria-live="polite">
      <div class="hud-copy">
        <span id="zone-name">1　仕込み台の下</span>
        <span id="attempt-count">1個目</span>
      </div>
      <div class="progress-track" aria-label="この区画の進行度">
        <span id="progress-fill"></span>
      </div>
      <div id="stage-dots" class="stage-dots" aria-hidden="true"></div>
      <div class="hud-detail">
        <p id="distance-label">この区画の残り 7.0 m</p>
        <p id="physics-readout">物理エンジンを初期化中</p>
      </div>
    </div>

    <div id="drag-hint" class="drag-hint" aria-hidden="true">
      <span>ドラッグ中、黄身が重心を動かす</span>
    </div>

    <div id="stall-hint" class="stall-hint" aria-hidden="true">
      <span>何かに当たっている。横へ逃がす</span>
    </div>

    <section id="intro" class="veil is-visible" aria-labelledby="intro-title">
      <div class="intro-copy">
        <p class="eyebrow">5区画　／　厨房の端から裏口まで</p>
        <h1 id="intro-title">厨房脱出</h1>
        <p>押すことはできません。ドラッグで黄身を偏らせると重心が移り、重力と床の摩擦だけで殻が転がります。厨房の何かへ強く当たれば、割れます。</p>
        <p id="intro-brief" class="intro-brief"></p>
        <p class="controls-note">スマホ：一指ドラッグ　PC：マウスドラッグ／矢印キー</p>
        <button id="start-button" type="button" disabled>物理計算を準備中</button>
      </div>
    </section>

    <section id="result" class="veil" aria-labelledby="result-title">
      <div class="result-copy">
        <p id="result-kicker" class="eyebrow">SPLAT</p>
        <h2 id="result-title">ぺしゃ。</h2>
        <p id="result-message">厨房は、止まらない。</p>
        <p id="stage-brief" class="stage-brief"></p>
        <button id="retry-button" type="button">すぐ再開</button>
      </div>
    </section>

    <p id="sr-status" class="sr-only" aria-live="assertive"></p>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
